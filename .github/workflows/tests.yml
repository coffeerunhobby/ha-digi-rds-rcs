name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Backward compatibility: the oldest Home Assistant we declare support
          # for (hacs.json), on the oldest Python it allows.
          - name: "min — HA 2024.12 / py3.12"
            python: "3.12"
            ha: "homeassistant==2024.12.0"
          # Current stable Python; pip resolves the newest HA that supports it.
          # Home Assistant 2026.3+ requires Python 3.14, so this job is capped
          # at HA 2026.2. That release's test harness does not constrain
          # pytest-asyncio, and the 1.x line dropped the implicit event loop,
          # which breaks every test with "no current event loop".
          - name: "stable — py3.13"
            python: "3.13"
            ha: "'pytest-asyncio<1.0'"
          # Forward compatibility: newest Python + newest Home Assistant.
          - name: "latest — py3.14"
            python: "3.14"
            ha: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        # A pinned `ha` constrains the resolver to that Home Assistant, which in
        # turn pulls the matching pytest-homeassistant-custom-component; an empty
        # `ha` lets pip pick the newest HA compatible with this Python.
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.ha }} -r requirements_test.txt

      - name: Run tests
        run: pytest -q
