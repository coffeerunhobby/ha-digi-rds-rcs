name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@50baf3a307f87100cf550d4ae127746595030d5d # master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  security:
    runs-on: ubuntu-latest
    name: Security scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install scanners
        run: pip install --quiet bandit ruff
      # Security and correctness rules (flake8-bandit / bugbear / async).
      # Scoped to the shipped integration: asserts are correct in tests, and
      # the dev probes run as scripts rather than inside the event loop.
      - name: Ruff
        run: ruff check custom_components/
      # Second opinion; medium severity and above fails the build.
      - name: Bandit
        run: bandit -q -r custom_components -ll
      # Catches credentials or tokens committed anywhere in the tree.
      - name: Secret scan
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0 # master
        with:
          scan-type: fs
          scanners: secret
          exit-code: "1"
          severity: HIGH,CRITICAL
