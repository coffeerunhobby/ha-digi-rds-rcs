# Security and correctness lint for the shipped integration.
#
# Scope is deliberately narrow: this complements hassfest and the test suite by
# catching security and likely bugs, not by enforcing a formatting style.
# There are no rule suppressions — findings are fixed rather than silenced.
target-version = "py312"

[lint]
select = [
    "S",      # flake8-bandit — security issues
    "B",      # flake8-bugbear — likely bugs
    "ASYNC",  # async pitfalls, e.g. blocking calls in the event loop
]
